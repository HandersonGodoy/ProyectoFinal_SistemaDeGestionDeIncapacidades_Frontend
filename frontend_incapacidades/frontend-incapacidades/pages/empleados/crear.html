<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Empleados - Crear</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Corporate Solutions</div>
            <div class="sidebar-user" id="userInfo"></div>
            <ul class="sidebar-menu">
                <li><a href="../../dashboard.html">Menu</a></li>
                <li><a href="listar.html" class="active">Empleados</a></li>
                <li><a href="../incapacidades/listar.html">Incapacidades</a></li>
                <li><a href="../seguimiento/historial.html">Seguimiento</a></li>
            </ul>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-danger" style="width:100%">Cerrar Sesion</button>
            </div>
        </aside>
        <main class="main-content">
            <div class="page-header">
                <h2>Crear Empleado</h2>
                <a href="listar.html" class="btn btn-secondary">Volver</a>
            </div>
            <div id="mensaje" class="alert" style="display:none"></div>
            <div style="background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);max-width:700px">
                <form id="formCrearEmpleado" onsubmit="event.preventDefault(); crearEmpleado();">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                        <div class="form-group">
                            <label>Nombres *</label>
                            <input type="text" name="nombres" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Apellidos *</label>
                            <input type="text" name="apellidos" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Documento * (solo números)</label>
                            <input type="text" id="documento" name="documento" class="form-control" required maxlength="20">
                        </div>
                        <div class="form-group">
                            <label>Correo *</label>
                            <input type="email" name="correo" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Teléfono * (solo números)</label>
                            <input type="text" id="telefono" name="telefono" class="form-control" required maxlength="15">
                        </div>
                        <div class="form-group">
                            <label>Cargo *</label>
                            <select id="cargo" name="cargo" class="form-control" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Área *</label>
                            <select id="area" name="area" class="form-control" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha Ingreso *</label>
                            <input type="date" name="fecha_ingreso" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" id="btnGuardar" class="btn btn-primary mt-4">Guardar Empleado</button>
                </form>
            </div>
        </main>
    </div>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/modules/empleados.js"></script>
    <script>
        if(!requireAuth()){};
        renderUserInfo();
        llenarSelectsFormulario();
        soloNumeros(document.getElementById('documento'));
        soloNumeros(document.getElementById('telefono'));
    </script>
</body>
</html>
