<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Incapacidades - Editar</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">📋 Corp Solutions</div>
            <div class="sidebar-user" id="userInfo"></div>
            <ul class="sidebar-menu">
                <li><a href="../../dashboard.html">🏠 Dashboard</a></li>
                <li><a href="../empleados/listar.html">👥 Empleados</a></li>
                <li><a href="listar.html" class="active">📝 Incapacidades</a></li>
                <li><a href="../seguimiento/historial.html">📊 Seguimiento</a></li>
            </ul>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-danger" style="width:100%">Cerrar Sesión</button>
            </div>
        </aside>
        <main class="main-content">
            <div class="page-header">
                <h2>Editar Incapacidad</h2>
                <a href="listar.html" class="btn btn-secondary">← Volver</a>
            </div>
            <div id="mensaje" class="alert" style="display:none"></div>
            <div style="background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);max-width:700px">
                <form id="formEditarIncapacidad" onsubmit="event.preventDefault(); actualizarIncapacidad();">
                    <input type="hidden" id="incapacidadId">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                        <div class="form-group">
                            <label>Fecha Inicio</label>
                            <input type="date" id="fecha_inicio" name="fecha_inicio" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Fecha Fin</label>
                            <input type="date" id="fecha_fin" name="fecha_fin" class="form-control">
                        </div>
                        <div class="form-group" style="grid-column:1 / -1">
                            <label>Observaciones</label>
                            <textarea id="observaciones" name="observaciones" class="form-control"></textarea>
                        </div>
                    </div>
                    <button type="submit" id="btnActualizar" class="btn btn-primary mt-4">Actualizar Incapacidad</button>
                </form>
            </div>
        </main>
    </div>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/modules/incapacidades.js"></script>
    <script>if(!requireAuth()){}; renderUserInfo(); cargarIncapacidadEdicion();</script>
</body>
</html>
